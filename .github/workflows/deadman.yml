name: deadman
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test run: uses VM_HEARTBEAT_TEST, state-test.json, TEST prefix"
        type: boolean
        default: false
      stale_min:
        description: "Minutes of silence before alerting"
        default: "40"
permissions:
  contents: write
concurrency: deadman
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check heartbeat
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STALE_MIN: ${{ inputs.stale_min || '40' }}
          VAR_NAME: ${{ inputs.test && 'VM_HEARTBEAT_TEST' || 'VM_HEARTBEAT' }}
          STATE_FILE: ${{ inputs.test && 'state-test.json' || 'state.json' }}
          PREFIX: ${{ inputs.test && 'TEST ' || '' }}
        run: python3 check.py
      - name: Commit state
        run: |
          git config user.name deadman-bot
          git config user.email deadman-bot@users.noreply.github.com
          git add state.json state-test.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "state"; git push; }
